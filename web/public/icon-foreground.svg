<!--
  The adaptive-icon foreground: icon.svg's mark with no tile behind it, drawn inside Android's safe zone.

  An adaptive icon is a 108x108dp foreground over a 108x108dp background, of which the launcher may mask
  anything outside the central 66dp — a circle, a squircle, a rounded square, the device decides. So the
  mark is scaled into that circle and everything else is transparent; the tile colour moves to
  res/values/ic_launcher_background.xml, where the launcher can parallax it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <rect x="76" y="108" width="360" height="296" rx="32" fill="none" stroke="#2f6fed" stroke-width="24"/>
    <path d="M150 208 L206 256 L150 304" fill="none" stroke="#2ecc71" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M244 308 h118" stroke="#8b93a1" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
