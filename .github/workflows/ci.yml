name: CI

# Two jobs, the pilot's shape:
#   web — every push and PR: `npm run build` in web/ (`tsc -b && vite build`) and the vitest suite.
#   apk — version tags only: the Capacitor/Android build, attached to the GitHub Release as
#         `botmaker-remote.apk`, the name the app's own updater and the README download.
#
# Tags are pushed by the umbrella's release (`./release.sh --remote <version>`), never here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npx vitest run

  apk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages` is set because the action's default is `tools platform-tools`, and Google removed the
      # legacy `tools` package from the SDK repository: v0.0.1's build failed on 2026-09-17 with
      # "Failed to find package 'tools'" before a single line of ours ran. Gradle installs what it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build web + sync + assemble APK
        run: |
          npm ci
          npm run build:web
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Stage the APK under its stable name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk botmaker-remote.apk

      - name: Resolve the version from the tag
        run: echo "JRELEASER_PROJECT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
